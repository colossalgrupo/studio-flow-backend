spring:
  application:
    name: studio-flow-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/studio-schedulle-db}
      auto-index-creation: true

server:
  port: ${PORT:8080}

studioflow:
  jwt:
    secret: ${JWT_SECRET:mBqQ9kX8vN2wZ7pR4tY6uC1sD3fG5hJ8kL0mN2pQ4rS6tU8vW0xY2zA4bC6dE8fG}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  resend:
    api-key: ${RESEND_API_KEY:}
  email:
    from: ${EMAIL_FROM:Studio Schedulle <naoresponda@studioschedulle.com.br>}
  frontend-url: ${FRONTEND_URL:https://app.studioschedulle.com.br}
  cors:
    # Origens liberadas para chamadas via navegador (o app Android não é afetado por CORS).
    # Sobrescreva via env var CORS_ALLOWED_ORIGINS (lista separada por vírgula) em cada ambiente.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://studioschedulle.com.br,https://www.studioschedulle.com.br,https://app.studioschedulle.com.br,http://localhost:3000,http://localhost:5173}
